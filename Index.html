<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Weather App</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0ea5e9;
            --secondary-color: #0284c7;
            --accent-color: #06b6d4;
            --dark-bg: #e0f2fe;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #0c4a6e;
            --text-secondary: #0369a1;
            --shadow: 0 20px 60px rgba(15, 23, 42, 0.15);
            --border-radius: 20px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f2fe 50%, #ffffff 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='blur'%3E%3CfeGaussianBlur in='SourceGraphic' stdDeviation='3'/%3E%3C/filter%3E%3Ccircle cx='30' cy='30' r='25' fill='rgba(255,255,255,0.7)' filter='url(%23blur)'/%3E%3C/svg%3E"),
                url("data:image/svg+xml,%3Csvg width='150' height='150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='blur2'%3E%3CfeGaussianBlur in='SourceGraphic' stdDeviation='4'/%3E%3C/filter%3E%3Cellipse cx='50' cy='40' rx='45' ry='30' fill='rgba(255,255,255,0.6)' filter='url(%23blur2)'/%3E%3C/svg%3E"),
                url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='blur3'%3E%3CfeGaussianBlur in='SourceGraphic' stdDeviation='2'/%3E%3C/filter%3E%3Ccircle cx='60' cy='50' r='35' fill='rgba(255,255,255,0.5)' filter='url(%23blur3)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 400px 400px, 600px 600px, 500px 500px;
            background-position: 0% 0%, 100% 50%, 50% 100%;
            animation: cloudDrift 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes cloudDrift {
            0%, 100% {
                background-position: 0% 0%, 100% 50%, 50% 100%;
            }
            50% {
                background-position: 100% 0%, 0% 50%, 50% 0%;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 20px 40px rgba(2, 132, 199, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Search Bar */
        .search-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 40px;
            animation: slideUp 0.6s ease-out;
        }

        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(2, 132, 199, 0.15);
            backdrop-filter: blur(10px);
        }

        .search-box:focus-within {
            border-color: var(--primary-color);
            background: linear-gradient(rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95)) padding-box,
                        linear-gradient(135deg, var(--primary-color), var(--accent-color)) border-box;
            box-shadow: 0 10px 50px rgba(14, 165, 233, 0.25);
        }

        .search-box input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        .search-box input::placeholder {
            color: #4a9bbe;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
        }

        /* Toggle Button */
        .toggle-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--primary-color);
            color: var(--text-primary);
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(2, 132, 199, 0.1);
        }

        .toggle-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.3);
        }

        /* Weather Display */
        .weather-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        /* Current Weather Card */
        .current-weather {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(224, 242, 254, 0.8));
            border: 1px solid rgba(14, 165, 233, 0.3);
            padding: 50px 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 50px rgba(2, 132, 199, 0.15);
            backdrop-filter: blur(15px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .current-weather::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.1), transparent);
            opacity: 0.3;
            border-radius: 50%;
        }

        .weather-icon {
            font-size: 6rem;
            margin: 20px 0;
            color: #0284c7;
            text-shadow: 0 20px 40px rgba(2, 132, 199, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        .temp-display {
            font-size: 5rem;
            font-weight: 700;
            margin: 20px 0;
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .weather-description {
            font-size: 1.5rem;
            color: var(--text-secondary);
            text-transform: capitalize;
            margin: 15px 0;
            font-weight: 500;
        }

        .location-display {
            font-size: 1.2rem;
            color: #0284c7;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Details Grid */
        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .detail-item {
            background: rgba(224, 242, 254, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(14, 165, 233, 0.2);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .detail-item:hover {
            background: rgba(14, 165, 233, 0.15);
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .detail-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Forecast */
        .forecast-container {
            grid-column: 1 / -1;
        }

        .forecast-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }

        .forecast-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(224, 242, 254, 0.8));
            border: 1px solid rgba(14, 165, 233, 0.25);
            padding: 25px 15px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(15px);
        }

        .forecast-card:hover {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(6, 182, 212, 0.1));
            border-color: var(--primary-color);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(2, 132, 199, 0.2);
        }

        .forecast-day {
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .forecast-icon {
            font-size: 2.5rem;
            margin: 12px 0;
            color: #0284c7;
        }

        .forecast-temp {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .forecast-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: capitalize;
        }

        /* Loading & Error */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--text-secondary);
            border-top-color: #0284c7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid rgba(255, 107, 107, 0.5);
            color: #ff9a9e;
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.3s ease-out;
        }

        .error-message i {
            margin-right: 10px;
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .weather-content {
                grid-template-columns: 1fr;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }

            .current-weather {
                padding: 30px 20px;
            }

            .temp-display {
                font-size: 3.5rem;
            }

            .weather-icon {
                font-size: 4rem;
            }
        }

        @media (max-width: 480px) {
            .search-container {
                flex-direction: column;
            }

            .search-box {
                flex-direction: column;
            }

            .header h1 {
                font-size: 2rem;
            }

            .temp-display {
                font-size: 2.5rem;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weather Dashboard</h1>
            <p>Get real-time weather updates anywhere</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search city name..."
                    autocomplete="off"
                >
                <button class="search-btn" onclick="searchWeather()">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>

        <div class="toggle-container">
            <button class="toggle-btn" onclick="toggleTemperature()">
                <i class="fas fa-thermometer-half"></i> °C | °F
            </button>
        </div>

        <div id="errorMessage"></div>

        <div id="weatherContent"></div>
    </div>

    <script>
        const API_KEY = '4d8fb5b93d4af21d66a2948710284366'; // Free OpenWeatherMap API Key
        let isCelsius = true;
        let currentWeatherData = null;
        let forecastData = null;

        // Get user's location on page load
        window.addEventListener('load', () => {
            getLocationAndWeather();
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchWeather();
            });
        });

        function getLocationAndWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        fetchWeatherByCoords(latitude, longitude);
                    },
                    () => {
                        // Default to New York if geolocation fails
                        fetchWeatherByCity('New York');
                    }
                );
            } else {
                fetchWeatherByCity('New York');
            }
        }

        function searchWeather() {
            const city = document.getElementById('searchInput').value.trim();
            if (city) {
                fetchWeatherByCity(city);
            } else {
                showError('Please enter a city name');
            }
        }

        function fetchWeatherByCity(city) {
            showLoading();
            clearError();

            Promise.all([
                fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${API_KEY}`),
                fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${API_KEY}`)
            ])
            .then(([res1, res2]) => {
                if (!res1.ok || !res2.ok) throw new Error('City not found');
                return Promise.all([res1.json(), res2.json()]);
            })
            .then(([current, forecast]) => {
                currentWeatherData = current;
                forecastData = forecast;
                displayWeather();
                document.getElementById('searchInput').value = '';
            })
            .catch(() => showError('Unable to fetch weather data. Please try again.'));
        }

        function fetchWeatherByCoords(lat, lon) {
            showLoading();
            clearError();

            Promise.all([
                fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`),
                fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`)
            ])
            .then(([res1, res2]) => {
                if (!res1.ok || !res2.ok) throw new Error('Error fetching weather');
                return Promise.all([res1.json(), res2.json()]);
            })
            .then(([current, forecast]) => {
                currentWeatherData = current;
                forecastData = forecast;
                displayWeather();
            })
            .catch(() => showError('Unable to fetch weather data.'));
        }

        function displayWeather() {
            if (!currentWeatherData) return;

            const { main, weather, wind, clouds, sys, name, coord } = currentWeatherData;
            const temp = isCelsius ? Math.round(main.temp) : Math.round((main.temp * 9/5) + 32);
            const feelsLike = isCelsius ? Math.round(main.feels_like) : Math.round((main.feels_like * 9/5) + 32);
            const tempUnit = isCelsius ? '°C' : '°F';
            
            const weatherIcon = getWeatherIcon(weather[0].main);
            const sunrise = new Date(sys.sunrise * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const sunset = new Date(sys.sunset * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            let html = `
                <div class="weather-content">
                    <div class="current-weather">
                        <div class="location-display">
                            <i class="fas fa-map-marker-alt"></i>
                            ${name}, ${sys.country}
                        </div>
                        <div class="weather-icon">${weatherIcon}</div>
                        <div class="temp-display">${temp}${tempUnit}</div>
                        <div class="weather-description">${weather[0].description}</div>
                        <div style="color: var(--text-secondary); margin-top: 10px;">
                            Feels like ${feelsLike}${tempUnit}
                        </div>
                        
                        <div class="weather-details">
                            <div class="detail-item">
                                <div class="detail-label">
                                    <i class="fas fa-droplet"></i> Humidity
                                </div>
                                <div class="detail-value">${main.humidity}%</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">
                                    <i class="fas fa-wind"></i> Wind Speed
                                </div>
                                <div class="detail-value">${wind.speed} m/s</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">
                                    <i class="fas fa-compress"></i> Pressure
                                </div>
                                <div class="detail-value">${main.pressure} mb</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">
                                    <i class="fas fa-cloud"></i> Cloudiness
                                </div>
                                <div class="detail-value">${clouds.all}%</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">
                                    <i class="fas fa-eye"></i> Visibility
                                </div>
                                <div class="detail-value">${(currentWeatherData.visibility / 1000).toFixed(1)} km</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">
                                    <i class="fas fa-sun"></i> UV Index
                                </div>
                                <div class="detail-value">${main.temp > 20 ? 'High' : 'Low'}</div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div style="background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); border: 1px solid rgba(102, 126, 234, 0.2); margin-bottom: 30px;">
                            <h3 style="margin-bottom: 20px; color: var(--accent-color); font-size: 1.3rem;">
                                <i class="fas fa-sun-plant-wilt"></i> Sun Times
                            </h3>
                            <div style="display: grid; gap: 15px;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="color: var(--text-secondary);">
                                        <i class="fas fa-arrow-up"></i> Sunrise
                                    </span>
                                    <span style="font-weight: 600; font-size: 1.1rem;">${sunrise}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="color: var(--text-secondary);">
                                        <i class="fas fa-arrow-down"></i> Sunset
                                    </span>
                                    <span style="font-weight: 600; font-size: 1.1rem;">${sunset}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="forecast-container">
                        <div class="forecast-title">
                            <i class="fas fa-calendar-days"></i> 5-Day Forecast
                        </div>
                        <div class="forecast-grid">
                            ${getForecastHTML()}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('weatherContent').innerHTML = html;
        }

        function getForecastHTML() {
            const forecastList = forecastData.list.filter((_, index) => index % 8 === 0); // Every 24 hours
            
            return forecastList.slice(0, 5).map(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short' });
                const temp = isCelsius ? Math.round(item.main.temp) : Math.round((item.main.temp * 9/5) + 32);
                const tempUnit = isCelsius ? '°C' : '°F';
                const icon = getWeatherIcon(item.weather[0].main);

                return `
                    <div class="forecast-card">
                        <div class="forecast-day">${day}</div>
                        <div class="forecast-icon">${icon}</div>
                        <div class="forecast-temp">${temp}${tempUnit}</div>
                        <div class="forecast-desc">${item.weather[0].main}</div>
                    </div>
                `;
            }).join('');
        }

        function getWeatherIcon(condition) {
            const iconMap = {
                'Clear': '☀️',
                'Clouds': '☁️',
                'Rain': '🌧️',
                'Drizzle': '🌦️',
                'Thunderstorm': '⛈️',
                'Snow': '❄️',
                'Mist': '🌫️',
                'Smoke': '💨',
                'Haze': '🌫️',
                'Dust': '🌪️',
                'Fog': '🌫️',
                'Sand': '🏜️',
                'Ash': '🌋',
                'Squall': '🌪️',
                'Tornado': '🌪️'
            };
            return iconMap[condition] || '🌤️';
        }

        function toggleTemperature() {
            isCelsius = !isCelsius;
            if (currentWeatherData) {
                displayWeather();
            }
        }

        function showLoading() {
            document.getElementById('weatherContent').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Loading weather data...
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('errorMessage').innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    ${message}
                </div>
            `;
        }

        function clearError() {
            document.getElementById('errorMessage').innerHTML = '';
        }
    </script>
</body>
</html>
